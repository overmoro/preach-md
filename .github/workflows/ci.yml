name: CI

# The release workflow only runs on a tag, so until this existed nothing was
# checked on a commit or a pull request. A canon-table mistake reached users
# before anything could fail.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Same ruleset the community plugin review runs against a release, so a
        # finding lands on the commit that caused it instead of on the scorecard
        # days later with no file or line. The rules are warnings by default, so
        # the script passes --max-warnings 0; without it this step would pass
        # while reporting problems.
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Check the committed main.js matches the source
        # main.js is a committed build artifact and is what Obsidian loads, so a
        # stale or hand-edited bundle would ship regardless of what src says.
        run: |
          if ! git diff --exit-code --stat -- main.js; then
            echo "::error::main.js does not match a fresh build of src/. Run 'npm run build' and commit the result."
            exit 1
          fi
